name: Backup restore check

# Weekly: downloads the latest production backup from object storage and restores it into a
# throwaway Postgres to prove backups are usable.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  restore:
    if: vars.BACKUP_BUCKET != ''
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: featherlog
          POSTGRES_PASSWORD: featherlog
          POSTGRES_DB: restore
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U featherlog" --health-interval 5s --health-retries 20
    steps:
      - name: Download latest backup
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          LATEST=$(aws s3 ls "s3://${{ vars.BACKUP_BUCKET }}/postgres/" --endpoint-url "${{ vars.BACKUP_ENDPOINT }}" | sort | tail -n1 | awk '{print $4}')
          aws s3 cp "s3://${{ vars.BACKUP_BUCKET }}/postgres/$LATEST" backup.sql.gz.age --endpoint-url "${{ vars.BACKUP_ENDPOINT }}"
      - name: Decrypt & restore
        run: |
          sudo apt-get install -y age >/dev/null
          echo "${{ secrets.BACKUP_AGE_KEY }}" > key.txt
          age -d -i key.txt backup.sql.gz.age | gunzip | PGPASSWORD=featherlog psql -h localhost -U featherlog -d restore -v ON_ERROR_STOP=1 >/dev/null
          PGPASSWORD=featherlog psql -h localhost -U featherlog -d restore -tAc "select count(*) from workspaces"
