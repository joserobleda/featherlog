name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: featherlog
          POSTGRES_PASSWORD: featherlog
          POSTGRES_DB: featherlog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U featherlog" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @featherlog/widget build
      - run: pnpm typecheck
      - name: Unit & integration tests (PGlite)
        run: pnpm test
      - name: Core tests against real Postgres (postgres-js)
        run: pnpm vitest run --project core
        env:
          TEST_DATABASE_URL: postgres://featherlog:featherlog@localhost:5432/featherlog

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: featherlog
          POSTGRES_PASSWORD: featherlog
          POSTGRES_DB: featherlog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U featherlog" --health-interval 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgres://featherlog:featherlog@localhost:5432/featherlog
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      APP_URL: http://localhost:3100
      SMTP_URL: smtp://localhost:1025
      MAILPIT_URL: http://localhost:8025
      MIGRATE_ON_START: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @featherlog/widget build
      - run: pnpm --filter @featherlog/web build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          E2E_START_COMMAND: pnpm --filter @featherlog/web start
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
